<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBA Süleyman Mizanı</title>
    <style>
        :root { --olur: #27ae60; --sikinti: #f39c12; --olmaz: #e74c3c; --bg: #1a1a2e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: #16213e; padding: 20px; border-radius: 15px; }
        .controls { display: grid; gap: 10px; margin-bottom: 20px; background: #0f3460; padding: 15px; border-radius: 10px; }
        input, select, button { padding: 12px; border-radius: 5px; border: none; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { background: #e94560; color: white; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .card { background: #1a1a2e; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 8px solid #333; position: relative; }
        .card-OLUR { border-color: var(--olur); }
        .card-SIKINTI { border-color: var(--sikinti); }
        .card-OLMAZ { border-color: var(--olmaz); }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 15px; font-size: 0.8em; font-weight: bold; margin-top: 10px; }
        .bg-OLUR { background: var(--olur); }
        .bg-SIKINTI { background: var(--sikinti); }
        .bg-OLMAZ { background: var(--olmaz); }
        .h-gun { position: absolute; top: 10px; right: 15px; font-size: 1.2em; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#e94560;">SÜLEYMAN MİZANI</h2>
    
    <div class="controls">
        <input type="date" id="birthDate" value="1971-10-10">
        <select id="startZodiac">
            <option value="6">Terazi (Venüs Başlangıç)</option>
            <option value="0">Koç (Mars Başlangıç)</option>
            <option value="1">Boğa (Venüs Başlangıç)</option>
            <option value="2">İkizler (Merkür Başlangıç)</option>
            <option value="3">Yengeç (Ay Başlangıç)</option>
            <option value="4">Aslan (Güneş Başlangıç)</option>
            <option value="5">Başak (Merkür Başlangıç)</option>
            <option value="7">Akrep (Mars Başlangıç)</option>
            <option value="8">Yay (Jüpiter Başlangıç)</option>
            <option value="9">Oğlak (Satürn Başlangıç)</option>
            <option value="10">Kova (Satürn Başlangıç)</option>
            <option value="11">Balık (Jüpiter Başlangıç)</option>
        </select>
        <button onclick="hesapla()">HESAPLA</button>
    </div>

    <div id="result"></div>
</div>

<script>
    const gezegenler = ["Mars", "Venüs", "Merkür", "Ay", "Güneş", "Merkür", "Venüs", "Mars", "Jüpiter", "Satürn", "Satürn", "Jüpiter"];

    function hesapla() {
        const d = document.getElementById('birthDate').value;
        const s = parseInt(document.getElementById('startZodiac').value);
        const res = document.getElementById('result');
        res.innerHTML = "";
        let ref = new Date(d);

        for (let i = 0; i < 12; i++) {
            let cur = new Date(ref);
            cur.setMonth(ref.getMonth() + i);
            if (cur.getDate() !== ref.getDate()) cur.setDate(0);

            const hDay = parseInt(new Intl.DateTimeFormat('tr-u-ca-islamic-umalqura-nu-latn', {day:'numeric'}).format(cur));
            const gz = gezegenler[(s + i) % 12];
            let evre = "";

            if (gz === "Venüs" || gz === "Jüpiter" || gz === "Güneş") {
                evre = hDay <= 10 ? "OLUR" : (hDay <= 20 ? "SIKINTI" : "OLMAZ");
            } else if (gz === "Ay" || gz === "Mars") {
                evre = hDay <= 10 ? "OLUR" : (hDay <= 20 ? "OLMAZ" : "SIKINTI");
            } else if (gz === "Merkür") {
                evre = hDay <= 10 ? "OLMAZ" : (hDay <= 20 ? "SIKINTI" : "OLUR");
            } else if (gz === "Satürn") {
                evre = hDay <= 15 ? "OLUR" : "OLMAZ";
            }

            res.innerHTML += `
                <div class="card card-${evre}">
                    <div class="h-gun">${hDay}</div>
                    <div style="color:#e94560; font-weight:bold;">${i+1}. EV: ${gz}</div>
                    <div style="font-size:0.8em; color:#aaa;">${cur.toLocaleDateString('tr-TR')}</div>
                    <div class="tag bg-${evre}">${evre}</div>
                </div>`;
        }
    }
</script>
</body>
</html>
